name: Build & Push Docker Image

on:
  push:
    branches:
      - release
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# One publish at a time per branch, in order: a run that starts while another is going waits for
# it instead of racing it to `latest`. Not cancel-in-progress: a stale run joining late would cancel
# the newer one.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs before anything is published. A push to `release` is the whole deploy
  # — Watchtower picks the new image up within minutes — so this is the last
  # point at which a broken build can be stopped without a rollback.
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's build stage.
          node-version: 22

      - name: Install
        run: npm ci && npm ci --prefix server && npm ci --prefix client

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build-and-push:
    needs: verify
    # A pull request is verified but not published; `latest` only ever moves
    # for a push to `release`.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # A stale run (a re-run, or one stuck in a GitHub outage and started later) must not put an
      # older commit on `latest` after a newer one: only the branch's current tip publishes.
      - name: Only the newest commit publishes
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${GITHUB_SHA:0:7} is no longer the tip of ${{ github.ref_name }} (${tip:0:7}): nothing published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.newest.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
