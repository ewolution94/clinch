name: Build & Push Docker Image

on:
  push:
    branches:
      - release
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# One publish at a time per branch, in order: a run that starts while another is going waits for
# it instead of racing it to `latest`. Not cancel-in-progress: a stale run joining late would cancel
# the newer one.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs before anything is published. A push to `release` is the whole deploy
  # — Watchtower picks the new image up within minutes — so this is the last
  # point at which a broken build can be stopped without a rollback.
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's build stage.
          node-version: 22

      - name: Install
        run: npm ci && npm ci --prefix server && npm ci --prefix client

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The production server as the image runs it, without Dashboard: its values block in the
      # page with the built-in ones (English, dark, the device's motion) on every route, and the
      # manifest.
      - name: Smoke test the production server
        run: |
          CLINCH_BROADCAST=off PORT=4691 node server/dist/index.js &
          for _ in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:4691/ && break; sleep 0.5; done
          curl -sf http://127.0.0.1:4691/ | grep -F '<script type="application/json" id="ewo-config">{"lang":"en","theme":"dark","motion":"system"}</script>' >/dev/null
          curl -sf http://127.0.0.1:4691/week/5 | grep -F 'id="ewo-config"' >/dev/null
          curl -sf http://127.0.0.1:4691/ewo.config.json | grep -F '"app": "clinch"' >/dev/null

      # The server against a stand-in for Dashboard's apps' port: it takes the manifest, and a
      # theme and language set for Clinch, with the family's motion, reach the page.
      - name: Smoke test Dashboard's values
        run: |
          node --input-type=module -e "
            import http from 'node:http';
            http.createServer((req, res) => {
              if (req.method === 'PUT' && req.url === '/v1/manifest/clinch') { req.resume(); return res.writeHead(204).end(); }
              if (req.url === '/v1/config/clinch') return res.writeHead(200, { 'content-type': 'application/json', etag: '\"1\"' }).end(JSON.stringify({ family: { motion: 'less' }, app: { theme: 'light', lang: 'de' } }));
              res.writeHead(404).end();
            }).listen(4692);
          " &
          DASHBOARD_URL=http://127.0.0.1:4692 CLINCH_BROADCAST=off PORT=4693 node server/dist/index.js &
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:4693/ | grep -F '"theme":"light"' >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:4693/ | grep -F '{"lang":"de","theme":"light","motion":"less"}' >/dev/null

  build-and-push:
    needs: verify
    # A pull request is verified but not published; `latest` only ever moves
    # for a push to `release`.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The release notes below read the last 30 commits.
          fetch-depth: 30

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # A stale run (a re-run, or one stuck in a GitHub outage and started later) must not put an
      # older commit on `latest` after a newer one: only the branch's current tip publishes.
      - name: Only the newest commit publishes
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${GITHUB_SHA:0:7} is no longer the tip of ${{ github.ref_name }} (${tip:0:7}): nothing published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # The deploy message on Telegram (census/server/src/announce.ts) quotes what changed: the
      # `Release-note:` trailers of the last 30 commits, as a label on the image. A failure here
      # costs the message its notes, never the deploy.
      - name: Release notes for the deploy message
        id: notes
        if: steps.newest.outputs.publish == 'true'
        continue-on-error: true
        run: |
          notes=$(git log -30 --format='%H%x1f%ct%x1f%(trailers:key=Release-note,valueonly,separator=%x1d)%x1e' |
            jq -Rsc 'split("\u001e") | map(ltrimstr("\n") | select(length > 0) | split("\u001f")
              | {sha: .[0], at: (.[1] | tonumber), notes: (.[2] // "" | split("\u001d") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)))})')
          echo "label=cloud.ewolution.changes=$(printf '%s' "$notes" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.newest.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            ${{ steps.notes.outputs.label }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
