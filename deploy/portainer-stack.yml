# The Clinch stack Portainer runs on the NAS.
#
# This is deliberately NOT the repo's docker-compose.yml. That one carries
# `build: .`, which makes Portainer try to build Clinch from source on the NAS
# instead of pulling the image CI already published. Paste this into Portainer's
# stack editor (or point a Git-backed stack at this file) — never that one.
#
# Kept in the repo so the deployed shape is reviewable. Portainer holds the
# authoritative copy; reconcile before pasting if you've changed it there.
#
# ⚠️ Watchtower used to be a second service in this file. It now lives in
# `watchtower-stack.yml` as a stack of its own — adopting it then costs this
# stack one label line rather than a rewrite, and one Watchtower can keep every
# labelled container on the NAS current, not just this one. The only thing
# needed here is the `watchtower.enable` label at the bottom.

services:
  clinch:
    image: ghcr.io/ewolution94/clinch:latest
    container_name: clinch
    restart: unless-stopped
    ports:
      - "4600:4600"
    environment:
      # How often the league is re-polled when nothing is being played.
      - CLINCH_REFRESH_MS=120000
      # …and while a game is in progress.
      - CLINCH_LIVE_REFRESH_MS=25000
      # German outlets that count as watchable on the schedule. The listings
      # parser already sees Nitro and Sky, so adding either is a change here
      # rather than in code.
      - CLINCH_OUTLETS=RTL,RTL+
      # Stop looking broadcasts up entirely:
      # - CLINCH_BROADCAST=off
      # Pin a completed season instead of following the live one:
      # - CLINCH_SEASON=2025
      # Visit counts: /_e and /_e.js are forwarded to Census over the `ewolution`
      # network. Remove the line to stop counting; the page doesn't change either way.
      - CLINCH_CENSUS=http://census:4901
    networks:
      # The shared network Census listens on. It must exist before this stack is
      # updated (Portainer → Networks → `ewolution`).
      - ewolution
    labels:
      # The opt-in Watchtower looks for. Without this label the container is
      # ignored entirely — which is the whole safety property, since Watchtower
      # runs with WATCHTOWER_LABEL_ENABLE=true. This single line is what turns
      # "push `release`" into a deploy.
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  ewolution:
    external: true

