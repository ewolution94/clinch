<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Home-screen install. No status-bar style on purpose: left at the
         default, iOS colours the bar from theme-color, which applySettings()
         already keeps in step with the dark and light themes. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Clinch" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070c" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Clinch — NFL standings and the playoff picture, at a glance."
    />
    <!-- Social preview (Slack, WhatsApp, LinkedIn, iMessage …). og.png is
         1200×630; bump ?v= when the image changes so caches refetch it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clinch" />
    <meta property="og:title" content="Clinch" />
    <meta property="og:description" content="NFL standings and the playoff picture on one screen." />
    <meta property="og:url" content="https://clinch.ewolution.cloud/" />
    <meta property="og:image" content="https://clinch.ewolution.cloud/og.png?v=7" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Clinch: NFL standings and the playoff picture on one screen." />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="preload"
      href="/fonts/space-grotesk.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Clinch</title>
    <!--
      Runs before first paint so a light-theme reader never sees a flash of the
      dark app. Deliberately duplicates applySettings() in lib/settings.ts —
      keep the two in step. Wrapped in try/catch because a blocked localStorage
      here would stop the module script below from ever loading.
    -->
    <script>
      (function () {
        try {
          var s = JSON.parse(
            localStorage.getItem("clinch-settings-v1") || "{}",
          );
          var theme =
            s.theme === "light" || s.theme === "creative" ? s.theme : "dark";
          var root = document.documentElement;
          root.dataset.theme = theme;
          if (s.motion === "full" || s.motion === "reduced")
            root.dataset.motion = s.motion;
          if (s.lang === "de") root.lang = "de";
          var dark = theme !== "light";
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#05070c" : "#eef2f9");
        } catch (e) {
          /* No preferences readable — the dark default in the markup stands. */
        }
      })();
    </script>
    <!-- splash:start (iOS launch images and the splash's look, written by development/plans/splash-rollout/launch.mjs) -->
    <link rel="apple-touch-startup-image" href="/splash/dark-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/dark-1260x2736.png" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/dark-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/dark-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/dark-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/dark-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/dark-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/dark-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/dark-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/dark-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/dark-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <style>
      /* The splash screen, written by development/plans/splash-rollout/launch.mjs: edit there, not here.
         The pre-paint script turns it on in the installed app (or with ?splash) and takes it away. It starts
         as the launch image left off: the mark, 120 pt, in the middle of the screen on the system's page
         colour (iOS picks the launch image by the system's appearance, not the app's saved theme). Then
         the mark makes its move, a glint crosses, and the splash fades into the app. Longhands only:
         Vite's minifier turns an animation shorthand without a name into `animation: none`. The mark's
         <svg> is 0 × 0 in the markup, so without this style (offline, a blocked file) nothing shows. */
      #splash { display: none; }
      .splash #splash { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; background: #05070c; touch-action: none; }
      #splash svg { width: 120px; height: 120px; translate: 0 calc(-1 * var(--splash-lift, 0px)); }
      #splash :where(g[class], .trace) { transform-box: view-box; animation-duration: 560ms; animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1); animation-delay: 60ms; animation-fill-mode: both; }
      #splash .gl { animation-name: splash-glint; animation-duration: 640ms; }
      @keyframes splash-glint { to { transform: translateX(2000px); } }
      #splash .p2 { transform-origin: 512px 512px; }
      #splash .p0 { animation-name: splash-cl-l; }
      #splash .p1 { animation-name: splash-cl-r; }
      #splash .p2 { animation-name: splash-cl-s; }
      @keyframes splash-cl-l { 40% { transform: translateX(-48px); } 64% { transform: translateX(8px); } }
      @keyframes splash-cl-r { 40% { transform: translateX(48px); } 64% { transform: translateX(-8px); } }
      @keyframes splash-cl-s { 56% { transform: scale(1); } 72% { transform: scale(1.35); } }
      .splash-out #splash { opacity: 0; pointer-events: none; transition: opacity 320ms ease; }
      .splash-out #splash svg { scale: 1.08; transition: scale 320ms cubic-bezier(0.3, 0, 0.2, 1); }
      @media (prefers-reduced-motion: reduce) {
        #splash :where(g[class], .trace) { animation: none; }
        .splash-out #splash { transition-duration: 200ms; }
        .splash-out #splash svg { scale: none; }
      }
    </style>
    <!-- splash:end -->
    <!--
      The splash screen's switch (#splash below; written by
      development/plans/splash-rollout, boot-splash.js). After the theme script,
      so it sees data-motion. Inline is fine: Clinch sets no CSP.
    -->
    <script>
      try {
        var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        if (standalone || /[?&]splash\b/.test(location.search)) {
          var root = document.documentElement;
          root.classList.add('splash');
          // The launch image centres the mark on the whole screen. Should the page start below the
          // status bar (with viewport-fit=cover it doesn't), lift the mark by half the bar.
          var lift = (screen.height - innerHeight) / 2;
          if (standalone && innerHeight > innerWidth && lift > 0 && lift < 60) root.style.setProperty('--splash-lift', lift + 'px');
          // Clinch keeps its own motion setting on <html data-motion> (set just before this runs).
          var still = matchMedia('(prefers-reduced-motion: reduce)').matches || root.dataset.motion === 'reduced';
          var played = still;
          var ready = false;
          var gone = false;
          var leave = function () {
            if (gone) return;
            gone = true;
            root.classList.add('splash-out');
            setTimeout(function () {
              var splash = document.getElementById('splash');
              if (splash) splash.remove();
              root.classList.remove('splash', 'splash-out');
            }, still ? 220 : 340);
          };
          document.addEventListener('animationend', function (e) {
            if (e.animationName !== 'splash-glint') return;
            played = true;
            if (ready) leave();
          });
          addEventListener('splash:ready', function () {
            ready = true;
            if (played) leave();
          });
          setTimeout(leave, 1500);
        } else {
          addEventListener('DOMContentLoaded', function () {
            var splash = document.getElementById('splash');
            if (splash) splash.remove();
          });
        }
      } catch (e) {}
    </script>
  </head>
  <body>

 x="352" y="-400" width="320" height="1824" fill="url(#glAclinch)" transform="rotate(20 512 512)"/></g></g></g></svg></div>
    <!-- splash-markup:end -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
